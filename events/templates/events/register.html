{% extends 'events/base.html' %}

{% block content %}
<div class="container">
    <div class="form-box">
        <h2 style="margin-bottom: 20px;">Event Registration</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Complete Registration</button>
        </form>
    </div>
</div>
{% endblock %}
