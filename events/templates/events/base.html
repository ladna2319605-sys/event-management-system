{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub — Event Management System</title>
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="{% url 'home' %}" class="logo">EventHub</a>
            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'event_list' %}">Events</a>
                <a href="{% url 'create_event' %}">+ Create Event</a>
                <a href="{% url 'register' %}">Register</a>
                <a href="{% url 'participants' %}">Participants</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-bottom: 0;">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block content %}{% endblock %}
</body>
</html>
